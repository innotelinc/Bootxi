name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural:
    name: Structural checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # verify.js builds real ISO9660 images, so it needs a mkisofs-compatible
      # writer. genisoimage supports every flag lib/iso.js uses; this is the
      # same MKISOFS setup the README documents for Linux.
      - name: Install ISO tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends genisoimage
          echo "MKISOFS=$(command -v genisoimage)" >> "$GITHUB_ENV"
          "$(command -v genisoimage)" -version

      # No dependencies to install: imgboot is plain Node + external tools.
      - name: Build fixtures and run structural checks
        run: npm test

  windows:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # VMware Workstation cannot be installed on a hosted runner (licensed,
      # and it needs a hypervisor), so this job uses the xorriso that ships
      # with MSYS2. That keeps the Windows-only paths covered: `where` tool
      # discovery, drive letters, VMDK/VMX output, the zero-copy hard link and
      # the xorriso mkisofs-emulation arguments.
      - name: Install ISO tooling
        shell: pwsh
        run: |
          $bash = 'C:\msys64\usr\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw 'MSYS2 is missing from this runner image' }
          & $bash -lc 'pacman -Sy --noconfirm --needed xorriso'
          $xorriso = 'C:\msys64\usr\bin\xorriso.exe'
          if (-not (Test-Path $xorriso)) { throw 'xorriso was not installed by pacman' }
          "MKISOFS=$xorriso" >> $env:GITHUB_ENV
          & $xorriso -version

      - name: Build fixtures and run structural checks
        run: npm test
